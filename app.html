<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การวางสื่อในร้าน</title>
<link rel="stylesheet" href="shd-theme.css?v=3">
<style>
  .wrap { max-width: var(--max-wide); margin: 0 auto; padding: var(--space-4); }
  main.wrap { padding-bottom: var(--space-6); }
  body { line-height: 1.6; }

  /* ---------- status line ---------- */
  .msg { padding: var(--space-3) var(--space-4); border-radius: var(--radius-s); margin-bottom: var(--space-4);
    border: 1px solid var(--c-brand-line); background: var(--c-brand-soft); color: var(--c-brand-strong); }
  .msg.err { background: var(--c-err-soft); color: var(--c-err); border-color: var(--c-err-line); font-weight: bold; }
  .msg.ok { background: var(--c-ok-soft); color: var(--c-ok); border-color: var(--c-ok-line); }

  /* ---------- office toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
  .seg { display: flex; flex-wrap: wrap; gap: var(--space-1); padding: var(--space-1); background: var(--c-surface-2);
    border: 1px solid var(--c-line); border-radius: var(--radius-m); }
  .seg button { min-height: var(--size-target); padding: var(--space-1) var(--space-3); border: 0; border-radius: var(--radius-s);
    background: transparent; color: var(--c-ink-2); font-size: var(--fs-m); cursor: pointer; }
  .seg button:hover { background: var(--c-brand-soft); }
  .seg button[aria-pressed="true"] { background: var(--c-surface); color: var(--c-brand-strong); font-weight: bold;
    box-shadow: var(--shadow-1); }
  .seg .n { display: inline-block; min-width: var(--size-icon); margin-left: var(--space-1); padding: 0 var(--space-2);
    border-radius: var(--radius-pill); background: var(--c-line); color: var(--c-ink); font-size: var(--fs-xs); }
  .seg .n.hot { background: var(--c-warn-soft); color: var(--c-warn); border: 1px solid var(--c-warn-line); }
  .toolbar .grow { flex: 1; }
  .linkbtn { min-height: var(--size-target); padding: var(--space-1) var(--space-2); border: 0; background: transparent;
    color: var(--c-brand-strong); font-size: var(--fs-m); cursor: pointer; text-decoration: underline; }

  /* ---------- section heads ---------- */
  .sec { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-5) 0 var(--space-3);
    font-size: var(--fs-l); }
  .sec:first-child { margin-top: 0; }
  .sec .count { font-size: var(--fs-xs); padding: var(--space-0) var(--space-2); border-radius: var(--radius-pill);
    background: var(--c-line); color: var(--c-ink); }
  .empty { padding: var(--space-4); color: var(--c-ink-2); background: var(--c-surface-2); border: 1px dashed var(--c-line-strong);
    border-radius: var(--radius-m); margin: 0; }

  /* ---------- campaign card ---------- */
  .card { --accent: var(--c-line-strong); background: var(--c-surface); border: 1px solid var(--c-line);
    border-left: var(--space-1) solid var(--accent); border-radius: var(--radius-m); padding: var(--space-4);
    margin-bottom: var(--space-3); box-shadow: var(--shadow-1); }
  .card.tone-ok { --accent: var(--c-ok); }
  .card.tone-warn { --accent: var(--c-warn-line); }
  .card.tone-err { --accent: var(--c-err); }
  .card-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
  .card h3 { margin: 0; font-size: var(--fs-xl); line-height: 1.3; }
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
  .chip { display: inline-block; padding: var(--space-0) var(--space-3); border-radius: var(--radius-pill);
    font-size: var(--fs-s); border: 1px solid var(--c-line-strong); background: var(--c-surface-2); color: var(--c-ink-2); }
  .chip.ok { background: var(--c-ok-soft); color: var(--c-ok); border-color: var(--c-ok-line); }
  .chip.warn { background: var(--c-warn-soft); color: var(--c-warn); border-color: var(--c-warn-line); }
  .chip.err { background: var(--c-err-soft); color: var(--c-err); border-color: var(--c-err-line); }
  .chip.code { font-family: var(--font-code); }
  .search { flex: 1; min-width: 12rem; max-width: 24rem; }
  .thumb { display: block; width: var(--size-thumb); height: var(--size-thumb); object-fit: cover; border-radius: var(--radius-s);
    border: 1px solid var(--c-line); background: var(--c-surface-2); }
  .until { text-align: right; min-width: var(--size-strip-w); }
  .until strong { display: block; font-size: var(--fs-xl); line-height: 1.3; }
  .until span { font-size: var(--fs-s); color: var(--c-ink-2); }
  .tone-ok .until strong { color: var(--c-ok); }
  .tone-warn .until strong { color: var(--c-warn); }
  .tone-err .until strong { color: var(--c-err); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(var(--size-field), 1fr)); gap: var(--space-3) var(--space-4);
    margin: var(--space-4) 0 0; }
  .facts div { min-width: 0; }
  .facts .wide { grid-column: 1 / -1; }
  .facts dt { font-size: var(--fs-xs); color: var(--c-ink-3); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .card .row { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); }

  /* ---------- detail ---------- */
  .back { margin-bottom: var(--space-3); }
  .photos { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(var(--size-photo), 1fr)); }
  .photos a { display: block; }
  .photos img { display: block; width: 100%; height: auto; border-radius: var(--radius-s); border: 1px solid var(--c-line);
    background: var(--c-surface-2); }
  details.hist { margin-top: var(--space-4); color: var(--c-ink-2); font-size: var(--fs-s); }
  details.hist summary { cursor: pointer; min-height: var(--size-target); display: flex; align-items: center; }
  .btn.danger { border-color: var(--c-err-line); color: var(--c-err); background: var(--c-surface); }
  .btn.danger:hover { background: var(--c-err-soft); border-color: var(--c-err); }

  /* ---------- branch picker ---------- */
  .picker { margin-bottom: var(--space-3); font-size: var(--fs-s); color: var(--c-ink-2); }
  .picker > .t { display: block; margin-bottom: var(--space-1); }
  .picker .req { color: var(--c-err); }
  .pick-btn { width: 100%; justify-content: space-between; text-align: left; }
  .pick-panel { margin-top: var(--space-2); padding: var(--space-3); background: var(--c-surface); border: 1px solid var(--c-line-strong);
    border-radius: var(--radius-m); box-shadow: var(--shadow-1); display: grid; gap: var(--space-3); }
  .pick-panel .row { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0; }
  .pick-list { max-height: var(--size-photo); overflow: auto; border: 1px solid var(--c-line); border-radius: var(--radius-s); }
  .pick-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); min-height: var(--size-target-lg);
    border-bottom: 1px solid var(--c-line); cursor: pointer; color: var(--c-ink); font-size: var(--fs-m); }
  .pick-row:hover { background: var(--c-brand-soft); }
  .pick-row input { width: var(--size-icon); height: var(--size-icon); flex: 0 0 var(--size-icon); }
  .pick-tx { display: flex; flex-direction: column; min-width: 0; }
  .pick-tx .sub { font-size: var(--fs-xs); color: var(--c-ink-3); }
  .pick-list .empty { border: 0; border-radius: 0; }
  .chosen { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
  .chip-x { margin-left: var(--space-1); border: 0; background: transparent; color: var(--c-brand-strong); text-decoration: underline;
    cursor: pointer; font-size: var(--fs-xs); min-height: var(--size-target); }
  .picker .seg { width: fit-content; }

  /* ---------- form ---------- */
  fieldset.card { margin-inline: 0; min-width: 0; }
  /* float the legend so the heading sits inside the card instead of straddling its top border */
  fieldset.card legend { float: left; width: 100%; padding: 0; margin: 0 0 var(--space-3); font-size: var(--fs-l); font-weight: bold; }
  fieldset.card legend + * { clear: both; }
  .hint { margin: 0 0 var(--space-3); font-size: var(--fs-s); color: var(--c-ink-2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(var(--size-field), 1fr)); gap: var(--space-3); }
  label.f { display: block; font-size: var(--fs-s); color: var(--c-ink-2); margin-bottom: var(--space-3); }
  .grid label.f { margin-bottom: 0; }
  label.f > span.t { display: block; margin-bottom: var(--space-1); }
  label.f .req { color: var(--c-err); }
  label.f input.input, label.f select.input, label.f textarea.input { width: 100%; }
  label.check { display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-target-lg); font-size: var(--fs-m); color: var(--c-ink); }
  label.check input { width: var(--size-icon); height: var(--size-icon); }
  .codes { margin: calc(var(--space-1) * -2) 0 var(--space-3); font-size: var(--fs-s); }
  .codes .bad { color: var(--c-err); font-weight: bold; }
  .codes .good { color: var(--c-ok); }
  .formbar { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .formwrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
  .photopanel { margin-bottom: 0; }
  .photopanel .photos { grid-template-columns: minmax(0, 1fr); }
  .photopanel .photos img { max-height: 70vh; object-fit: contain; }
  .photopanel summary { cursor: pointer; font-weight: bold; min-height: var(--size-target); display: flex; align-items: center; }
  @media (min-width: 900px) {
    .formwrap.has-photos { grid-template-columns: minmax(0, 1fr) var(--size-photo); align-items: start; }
    .formwrap.has-photos form { grid-column: 1; grid-row: 1; }
    .formwrap.has-photos .photopanel { grid-column: 2; grid-row: 1; position: sticky; top: var(--space-4); max-height: calc(100vh - var(--space-6)); overflow: auto; }
  }

  @media (pointer: coarse), (max-width: 640px) {
    .btn, .seg button, .linkbtn { min-height: var(--size-target-lg); }
    .wrap { padding: var(--space-3); }
    .until { text-align: left; }
    .card-head { flex-direction: column; }
  }
</style>
</head>
<body>
<header class="top"><div class="top-inner wrap">
  <div class="title"><h1>การวางสื่อในร้าน</h1><p id="who"></p></div>
  <span class="top-link" id="role" hidden></span>
</div></header>
<main class="wrap">
  <div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
  <div id="bar" class="toolbar" hidden></div>
  <section id="view"></section>
</main>
<script>
(function () {
  'use strict';
  // Filled when the page is published (see docs/deploy.md). The page refuses to run on the placeholder.
  var SUPABASE_URL = 'https://zuyqwkjvjuwykrdhzhwq.supabase.co';
  var STORE_KEY = 'shd-session';
  var BRANCH_RE = /^[A-Z]{2}\d{3}$/;
  var $ = function (id) { return document.getElementById(id); };
  var sess = null, tab = 'pending', types = [], all = [], units = [], people = [];

  var ROLE_TH = { ADMIN: 'ผู้ดูแลระบบ', APPROVER: 'ผู้อนุมัติ', REGISTRANT: 'ผู้ลงทะเบียน', STAFF: 'สาขา' };
  var ERR = {
    'missing:brand': 'ยังไม่ได้ใส่แบรนด์/ผู้ส่ง', 'missing:position_type': 'ยังไม่ได้เลือกประเภทตำแหน่ง',
    'missing:dates': 'ยังไม่ได้ใส่วันเริ่ม และวันสิ้นสุด (หรือติ๊ก "ไม่มีวันหมดอายุ")', 'missing:agreement_no': 'ยังไม่ได้ใส่เลขที่สัญญา/TTA',
    'missing:ad': 'ยังไม่ได้ใส่เลขโฆษณาและวันหมดอายุ', 'missing:branches': 'ยังไม่ได้เลือกสาขา',
    self: 'ผู้ลงทะเบียนอนุมัติของตัวเองไม่ได้', state: 'สถานะเปลี่ยนไปแล้ว กรุณาโหลดใหม่',
    expired: 'เซสชันหมดอายุ กรุณาเข้าใหม่จากเมนู Job Tracker', bad_signature: 'ลิงก์ไม่ถูกต้อง กรุณาเข้าใหม่จากเมนู Job Tracker',
    malformed: 'ลิงก์ไม่ถูกต้อง กรุณาเข้าใหม่จากเมนู Job Tracker', reused: 'ลิงก์ถูกใช้แล้ว กรุณาเข้าใหม่จากเมนู Job Tracker',
    forbidden: 'ไม่มีสิทธิ์ทำรายการนี้', bad_branches: 'รหัสสาขาไม่ถูกต้อง (รูปแบบ เช่น IC008)'
  };
  function errText(code) {
    if (ERR[code]) return ERR[code];
    if (/^cap:/.test(code)) return 'สาขา ' + code.slice(4) + ' วางตำแหน่งนี้เต็มเพดานในช่วงวันที่ชนกัน อนุมัติไม่ได้';
    return 'ทำรายการไม่สำเร็จ (' + code + ')';
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function button(label, cls, onClick) {
    var b = el('button', 'btn' + (cls ? ' ' + cls : ''), label); b.type = 'button'; b.onclick = onClick; return b;
  }
  // kind: 'err' interrupts the reader (role=alert); others are polite status updates
  function show(text, kind) {
    var m = $('msg');
    m.hidden = !text; m.textContent = text || '';
    m.className = 'msg' + (kind ? ' ' + kind : '');
    m.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  }
  function loading(text) { show(text || 'กำลังโหลด...'); $('view').setAttribute('aria-busy', 'true'); }
  function done() { $('view').removeAttribute('aria-busy'); }

  function post(path, body, headers) {
    var h = { 'content-type': 'application/json' };
    for (var k in (headers || {})) h[k] = headers[k];
    return fetch(SUPABASE_URL + '/functions/v1/' + path, { method: 'POST', headers: h, body: JSON.stringify(body), cache: 'no-store' })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }, function () { return { status: r.status, data: null }; }); },
        function () { return { status: 0, data: null }; });
  }
  function api(action, body) {
    var b = body || {}; b.action = action;
    return post('shd-api', b, { 'x-shd-session': sess.session }).then(function (r) {
      if (r.status === 401) { sessionStorage.removeItem(STORE_KEY); throw new Error(errText(r.data && r.data.error)); }
      if (r.status === 0) throw new Error('เชื่อมต่อไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่');
      if (r.status !== 200) { var e = new Error(errText(r.data && r.data.error)); e.code = r.data && r.data.error; throw e; }
      return r.data;
    });
  }
  function fail(e) { done(); show(e.message, 'err'); }

  var isApprover = function () { return sess.staff.role === 'ADMIN' || sess.staff.role === 'APPROVER'; };
  var isOffice = function () { return isApprover() || sess.staff.role === 'REGISTRANT'; };

  // ---------- dates ----------
  var TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  function thDate(s) { if (!s) return '-'; var p = s.split('-'); return Number(p[2]) + ' ' + TH_M[Number(p[1]) - 1] + ' ' + (Number(p[0]) + 543); }
  function today() { return new Date(Date.now() + 7 * 3600 * 1000).toISOString().slice(0, 10); }
  function daysTo(s) { return Math.round((Date.parse(s + 'T00:00:00Z') - Date.parse(today() + 'T00:00:00Z')) / 86400000); }
  function ageDays(c) { return c.created_at ? Math.max(0, -daysTo(c.created_at.slice(0, 10))) : 0; }

  // ---------- campaign card (shared by branch list, office list, detail) ----------
  function fact(dl, label, value, wide) {
    if (!value) return;
    var d = el('div', wide ? 'wide' : ''); d.appendChild(el('dt', '', label)); d.appendChild(el('dd', '', value)); dl.appendChild(d);
  }
  // The answer branches look for first: how long may this stay?
  function untilBlock(c) {
    if (c.status !== 'approved') return null;
    var u = el('div', 'until');
    if (c.open_ended) { u.appendChild(el('strong', '', 'ไม่มีวันหมดอายุ')); u.appendChild(el('span', '', 'เริ่ม ' + thDate(c.start_date))); return u; }
    if (!c.end_date) return null;
    var left = daysTo(c.end_date);
    var head = left < 0 ? 'สิ้นสุดแล้ว' : left === 0 ? 'วันสุดท้ายวันนี้' : 'เหลือ ' + left + ' วัน';
    if (c.start_date && daysTo(c.start_date) > 0) head = 'เริ่มอีก ' + daysTo(c.start_date) + ' วัน';
    u.appendChild(el('strong', '', head)); u.appendChild(el('span', '', 'สิ้นสุด ' + thDate(c.end_date)));
    return u;
  }
  function incomplete(c) {
    return c.status === 'approved' && (!c.brand || !(c.position_types || c.shd_position_types) || !(c.campaign_branches || []).length);
  }
  function toneOf(c) {
    if (c.status === 'cancelled') return 'tone-err';
    if (c.status === 'pending') return 'tone-warn';
    if (c.open_ended) return 'tone-ok';
    if (!c.end_date) return '';
    var left = daysTo(c.end_date);
    return left <= 0 ? 'tone-err' : left <= 7 ? 'tone-warn' : 'tone-ok';
  }
  function card(c, opts) {
    opts = opts || {};
    var d = el('article', 'card ' + toneOf(c));
    var head = el('div', 'card-head'), left = el('div');
    left.appendChild(el('h3', '', c.brand || '(ยังไม่มีชื่อแบรนด์)'));
    var chips = el('div', 'chips');
    if (opts.office && c.code) chips.appendChild(el('span', 'chip code', c.code));
    if (c.position_types) chips.appendChild(el('span', 'chip', c.position_types.name));
    if (c.package) chips.appendChild(el('span', 'chip', 'แพ็กเกจ ' + c.package));
    if (c.status === 'pending') chips.appendChild(el('span', 'chip warn', 'รออนุมัติ'));
    if (c.status === 'cancelled') chips.appendChild(el('span', 'chip err', 'ยกเลิกแล้ว'));
    if (c.source === 'warehouse') chips.appendChild(el('span', 'chip warn', 'จากคลัง'));
    if (opts.office && c.photo_count > 1) chips.appendChild(el('span', 'chip', c.photo_count + ' รูป'));
    if (c.status === 'pending' && c.start_date && daysTo(c.start_date) <= 14) chips.appendChild(el('span', 'chip err', 'เร่งด่วน'));
    if (opts.office && incomplete(c)) chips.appendChild(el('span', 'chip warn', 'ต้องกรอกข้อมูลเพิ่ม'));
    if (c.open_ended && c.status !== 'approved') chips.appendChild(el('span', 'chip ok', 'ไม่มีวันหมดอายุ'));
    left.appendChild(chips); head.appendChild(left);
    var u = untilBlock(c); if (u) head.appendChild(u);
    if (opts.office && c.thumb_url) {
      var a = el('a'); a.href = c.thumb_url; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', 'เปิดรูปจากคลัง');
      var im = el('img', 'thumb'); im.src = c.thumb_url; im.alt = 'รูปจากคลัง'; im.loading = 'lazy';
      a.appendChild(im); head.appendChild(a);
    }
    d.appendChild(head);

    var dl = el('dl', 'facts');
    var period = c.open_ended ? thDate(c.start_date) + ' เป็นต้นไป' : (c.start_date || c.end_date) ? thDate(c.start_date) + ' ถึง ' + thDate(c.end_date) : '';
    fact(dl, 'ช่วงที่วาง', period);
    fact(dl, 'เลขที่สัญญา/TTA', c.agreement_no);
    fact(dl, 'เลขโฆษณา', c.ad_no ? c.ad_no + (c.ad_expiry ? ' (หมดอายุ ' + thDate(c.ad_expiry) + ')' : '') : '');
    fact(dl, 'ติดต่อ', [c.registrant_dept, c.supplier_contact].filter(Boolean).join(' · '));
    fact(dl, 'วิธีวาง/ข้อห้าม', c.how_to_place, true);
    fact(dl, 'หลังสิ้นสุด', c.return_to, true);
    if (opts.office) {
      var br = (c.campaign_branches || []).length;
      fact(dl, 'สาขา', br ? br + ' สาขา' : 'ยังไม่ได้เลือกสาขา');
      if (c.status === 'pending') fact(dl, 'ค้างมา', ageDays(c) + ' วัน');
      if (c.approved_by_name) fact(dl, 'อนุมัติโดย', c.approved_by_name + (String(c.approved_by || '').indexOf('line:') === 0 ? ' (ผ่าน LINE)' : ''));
      if (c.notes) fact(dl, 'หมายเหตุ', c.notes, true);
    }
    if (dl.childNodes.length) d.appendChild(dl);
    if (opts.actions) { var row = el('div', 'row'); opts.actions.forEach(function (a) { row.appendChild(a); }); d.appendChild(row); }
    return d;
  }

  // Photos the warehouse sent; opens full size in a new tab so brand text on the box can be read.
  function photoGrid(photos) {
    var strip = el('div', 'photos');
    photos.forEach(function (p) {

  // ---------- multi picker ----------
  // Same idea as the pickers in Job Tracker: a dropdown with search and tick boxes, ticked items shown as removable chips.
  // An item can stand for several leaves (a department or area stands for every branch under it); the state is always the
  // set of leaf codes, so a single leaf can still be removed after ticking its group.
  // cfg: {title, required, noun, placeholder, searchPlaceholder, items:[{code,name,sub,leaves,group}], initial:[codes],
  //       labelOf(code), filters:[[key,label,test(item)]], validCode(code)}
  function multiPicker(box, cfg) {
    var chosen = {};
    cfg.initial.forEach(function (x) { chosen[x] = true; });
    var filterKey = 'all', query = '';

    var root = el('div', 'picker');
    var t = el('span', 't', cfg.title);
    if (cfg.required) t.appendChild(el('span', 'req', ' *'));
    root.appendChild(t);
    var open = button('', 'alt pick-btn', function () { toggle(); }); open.setAttribute('aria-expanded', 'false'); root.appendChild(open);
    var panel = el('div', 'pick-panel'); panel.hidden = true; root.appendChild(panel);

    var search = el('input', 'input'); search.type = 'search'; search.placeholder = cfg.searchPlaceholder;
    search.setAttribute('aria-label', cfg.searchPlaceholder);
    panel.appendChild(search);
    var filters = cfg.filters || [];
    if (filters.length > 1) {
      var seg = el('div', 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'ประเภท');
      filters.forEach(function (f, i) {
        var b = el('button', '', f[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(i === 0));
        b.onclick = function () {
          filterKey = f[0];
          Array.prototype.forEach.call(seg.children, function (x, j) { x.setAttribute('aria-pressed', String(filters[j][0] === filterKey)); });
          render();
        };
        seg.appendChild(b);
      });
      panel.appendChild(seg);
    }
    var tools = el('div', 'row');
    var list = el('div', 'pick-list');
    tools.appendChild(button('เลือกทั้งหมดที่แสดง', 'alt', function () {
      visible().forEach(function (it) { it.leaves.forEach(function (x) { chosen[x] = true; }); }); render();
    }));
    tools.appendChild(button('ล้างที่เลือก', 'alt', function () { chosen = {}; render(); }));
    tools.appendChild(button('เสร็จ', '', function () { toggle(false); }));
    panel.appendChild(tools); panel.appendChild(list);
    var chips = el('div', 'chosen'); chips.setAttribute('aria-live', 'polite'); root.appendChild(chips);

    function toggle(force) {
      var willOpen = force === undefined ? panel.hidden : force;
      panel.hidden = !willOpen; open.setAttribute('aria-expanded', String(willOpen));
      if (willOpen) search.focus();
    }
    function visible() {
      var q = query.trim().toLowerCase();
      var f = filters.filter(function (x) { return x[0] === filterKey; })[0];
      return cfg.items.filter(function (it) {
        if (f && !f[2](it)) return false;
        return !q || (it.name + ' ' + it.code).toLowerCase().indexOf(q) !== -1;
      });
    }
    function render() {
      var keep = list.scrollTop;
      list.textContent = '';
      var vis = visible();
      if (!vis.length) list.appendChild(el('p', 'empty', 'ไม่พบรายการที่ตรงกับคำค้น'));
      vis.forEach(function (it) {
        var n = it.leaves.filter(function (b) { return chosen[b]; }).length;
        var l = el('label', 'pick-row'), cb = el('input'); cb.type = 'checkbox';
        cb.checked = it.leaves.length > 0 && n === it.leaves.length; cb.indeterminate = n > 0 && n < it.leaves.length;
        cb.onchange = function () { it.leaves.forEach(function (b) { if (cb.checked) chosen[b] = true; else delete chosen[b]; }); render(); };
        l.appendChild(cb);
        var tx = el('span', 'pick-tx'); tx.appendChild(el('span', 'nm', it.name)); tx.appendChild(el('span', 'sub', it.sub));
        l.appendChild(tx); list.appendChild(l);
      });
      list.scrollTop = keep;
      var codes = Object.keys(chosen).sort();
      open.textContent = codes.length ? 'เลือกแล้ว ' + codes.length + ' ' + cfg.noun + ' (กดเพื่อเพิ่ม/แก้ไข)' : cfg.placeholder;
      chips.textContent = '';
      codes.forEach(function (code) {
        var chip = el('span', 'chip');
        chip.appendChild(document.createTextNode(cfg.labelOf(code) + ' '));
        var x = el('button', 'chip-x', 'ลบ'); x.type = 'button'; x.setAttribute('aria-label', 'ลบ ' + cfg.labelOf(code));
        x.onclick = function () { delete chosen[code]; render(); };
        chip.appendChild(x); chips.appendChild(chip);
      });
    }
    search.oninput = function () { query = search.value; render(); };
    panel.addEventListener('keydown', function (e) { if (e.key === 'Escape') { toggle(false); open.focus(); } });
    box.appendChild(root); render();
    return {
      getCodes: function () { return Object.keys(chosen); },
      valid: function () { return !cfg.validCode || Object.keys(chosen).every(cfg.validCode); },
      focus: function () { open.focus(); }
    };
  }

  // Branches: single branches, or a department / area that stands for every branch under it.
  function branchPicker(box, initial) {
    var byCode = {}, children = {};
    units.forEach(function (u) { byCode[u.code] = u; var k = u.parent_code || ''; (children[k] = children[k] || []).push(u.code); });
    function under(code) {
      var out = [], stack = [code], seen = {};
      while (stack.length) {
        var c = stack.pop();
        if (seen[c]) continue;
        seen[c] = true;
        if (byCode[c] && byCode[c].is_branch) out.push(c);
        (children[c] || []).forEach(function (x) { stack.push(x); });
      }
      return out;
    }
    var items = [];
    units.forEach(function (u) {
      var leaves = under(u.code);
      if (!leaves.length) return;
      items.push({ code: u.code, name: u.name, group: !u.is_branch, leaves: leaves,
        sub: u.code + ' · ' + (u.is_branch ? 'สาขา' : (u.unit_type || 'กลุ่ม') + ' · ' + leaves.length + ' สาขา') });
    });
    return multiPicker(box, {
      title: 'สาขา / แผนก', required: true, noun: 'สาขา', placeholder: 'เลือกสาขาหรือแผนก...',
      searchPlaceholder: 'พิมพ์ชื่อหรือรหัสสาขา/แผนก...', items: items, initial: initial,
      labelOf: function (code) { return byCode[code] ? byCode[code].name + ' ' + code : code; },
      filters: [['all', 'ทั้งหมด', function () { return true; }], ['branch', 'สาขา', function (i) { return !i.group; }], ['group', 'แผนก/กลุ่ม', function (i) { return i.group; }]],
      validCode: function (x) { return BRANCH_RE.test(x); }
    });
  }

  // Designated Approver: the people listed as approvers in Job Tracker.
  function peoplePicker(box, initial) {
    var byName = {};

      searchPlaceholder: 'พิมพ์ชื่อผู้อนุมัติ...', initial: initial,
      items: people.map(function (x) { return { code: x.username, name: x.name, sub: x.username, leaves: [x.username] }; }),
      labelOf: function (code) { return byName[code] || code; }
    });
  }

    var v = $('view'); v.textContent = '';
    v.appendChild(button('← กลับรายการ', 'alt back', renderOffice));
    v.appendChild(el('h2', 'sec', 'ตั้งค่าประเภทตำแหน่ง'));
    types.forEach(function (t) {
      var d = el('section', 'card'); d.appendChild(el('h3', '', t.name));
      var l = el('label', 'f'); l.appendChild(el('span', 't', 'เพดานต่อสาขา (เว้นว่าง = ไม่จำกัด)'));
      var i = el('input', 'input'); i.type = 'number'; i.min = 1; i.value = t.max_per_branch === null ? '' : t.max_per_branch;
      l.appendChild(i); d.appendChild(l);
      var row = el('div', 'row');
      row.appendChild(button('บันทึก', '', function () {
        var max = i.value === '' ? null : Number(i.value);
        api('types_save', { name: t.name, max_per_branch: max, extendable: t.extendable, needs_ad: t.needs_ad, active: t.active })
          .then(function () { t.max_per_branch = max; show('บันทึกเพดานของ ' + t.name + ' แล้ว', 'ok'); }).catch(function (e) { show(e.message, 'err'); });
      }));
      d.appendChild(row); v.appendChild(d);
    });
  }

  // ---------- start ----------
  function start(s) {
    sess = s;
    $('who').textContent = (s.staff.n || '') + ' · ' + (s.staff.un || '');
    var role = $('role'); role.textContent = ROLE_TH[s.staff.role] || s.staff.role || ''; role.hidden = !role.textContent;
    show('');
    if (isOffice()) {
      var unitsReq = api('units').then(function (d) { units = d.units || []; people = d.people || []; }).catch(function () { units = []; people = []; });
      api('types_list').then(function (d) { types = d.types.filter(function (t) { return t.active; }); return unitsReq; })
        .then(function () { loadOffice(); }).catch(fail);
    } else {
      loading();
      api('list').then(function (d) { show(''); renderBranch(d.campaigns); }).catch(fail);
    }
  }
  if (SUPABASE_URL.indexOf('__') === 0) { show('หน้านี้ยังไม่ได้ตั้งค่า (SUPABASE_URL)', 'err'); return; }
  var q = new URLSearchParams(location.search), sso = q.get('sso');
  if (sso) {
    q.delete('sso'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : ''));
    show('กำลังเข้าสู่ระบบ...');
    post('shd-session', { link: sso }).then(function (r) {
      if (r.status === 200 && r.data && r.data.session) {
        var s = { session: r.data.session, staff: r.data.staff || {} };
        try { sessionStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* storage blocked */ }
        start(s);
      } else show(errText(r.data && r.data.error), 'err');
    });
  } else {
    var raw = null; try { raw = JSON.parse(sessionStorage.getItem(STORE_KEY)); } catch (e) { /* ignore */ }
    if (raw && raw.session) start(raw); else show('กรุณาเข้าผ่านเมนูใน Job Tracker', 'err');
  }
})();
</script>
</body>
</html>
